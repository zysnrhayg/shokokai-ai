    <script type="text/javascript">

        function createpassword() {
            let type = $("#password").attr("type")
            if (type == "password") {
                $(".align-middle").attr("src", "./static/img/icons/eye-line.png")
                $("#password").attr("type", "text")
            } else {
                $(".align-middle").attr("src", "./static/img/icons/eye-off-line.png")
                $("#password").attr("type", "password")
            }
        }

      $(function(){
        $("body").fadeIn("slow")
      })

      $("#loginbtn").on("click", function(e) {
        console.log(1)
        e.preventDefault()
        username = $("#username").val()
        password = $("#password").val()
        localStorage.setItem("userid", username)
        $.ajax({
          url: apiUrl + "/login.do",
          type: "POST",
          contentType :  "application/json",
          data: JSON.stringify({
            userid: username,
            pwd: password,
            isMobile: '0'
          }),
          async: false,
          success: function(res) {
            if (res.indexOf("OK") != -1) {
              let data = JSON.parse(res)
              let name = data.username || username
              localStorage.setItem("username", name)
              localStorage.setItem("home_page", data.OK)
              localStorage.removeItem("menuData")
              window.location.href = data.OK
            } else {
              let msg = JSON.parse(res)
              if (msg.i) alert(msg.i)
              if (msg.e) alert(msg.e)
            }
          }
        })
      })

    </script>
