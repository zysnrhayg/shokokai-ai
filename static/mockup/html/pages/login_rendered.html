<div class="app-view" id="view-login" style="display: block;">
  <div class="login-screen">
    <div class="login-card">
      <div class="login-brand">商工会<span>AI</span>システム</div>

      <div class="login-step-title">ログイン</div>
      <div class="login-error" id="login-error" style="display:none">⚠ 入力内容をご確認ください</div>

      <form id="login-form">
        <div class="login-field">
          <label class="login-label" for="login-prefecture">県</label>
          <select class="form-input" id="login-prefecture">
            <option>北海道</option>
          </select>
        </div>
        <div class="login-field">
          <label class="login-label" for="login-user-id">ユーザID</label>
          <input class="form-input" id="login-user-id" placeholder="ユーザID" autocomplete="username">
        </div>
        <div class="login-field">
          <label class="login-label" for="login-password">パスワード</label>
          <input class="form-input" type="password" id="login-password" placeholder="パスワード" autocomplete="current-password">
        </div>
        <div class="login-checkbox-field">
          <label><input type="checkbox"> ログイン状態を保持する</label>
        </div>
        <button type="submit" class="btn btn-primary btn-block">ログイン</button>
      </form>

      <div class="login-notice">
        <div class="login-notice__title">📢 お知らせ</div>
        <div class="login-notice__item">2026年7月分の月次報告の提出締め切りは2026年8月25日です</div>
      </div>
    </div>
    <div class="login-footnote">© 全国商工会連合会</div>
  </div>
</div>
